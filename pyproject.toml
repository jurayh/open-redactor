[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "open-redactor"
version = "0.2.2"
description = "Open-source CLI to make video share-safe with SAM 3.1 prompt-driven redaction"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
  { name = "Yuriy H" }
]
keywords = ["video", "redaction", "sam", "privacy", "cli"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
]
dependencies = [
  "numpy>=1.26",
  "Pillow>=10.0",
  "opencv-python-headless>=4.8",
  "httpx>=0.25",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "pytest-cov>=4.1",
]
pii = [
  "pytesseract>=0.3.10",
  "pandas>=2.0",
  "rapidocr-onnxruntime>=1.3",
]
local = [
  "torch>=2.2",
  "transformers>=4.44",
  "accelerate>=0.33",
]

[project.scripts]
open-redactor = "open_redactor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
